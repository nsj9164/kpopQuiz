<script type="text/plain" data-file="src/orders/orders.service.ts">
import { Injectable, NotFoundException, BadRequestException, Logger } from '@nestjs/common';
import { InjectRepository } from '@nestjs/typeorm';
import { Repository, DataSource, In } from 'typeorm';
import { Order, OrderStatus } from './entities/order.entity';
import { OrderItem } from './entities/order-item.entity';
import { CreateOrderDto } from './dto/create-order.dto';
import { PaymentsService } from '../payments/payments.service';
import { toKstDate } from '../common/utils/date.util';

const MAX_ITEMS_PER_ORDER = 50;

@Injectable()
export class OrdersService {
  private readonly logger = new Logger(OrdersService.name);

  constructor(
    @InjectRepository(Order)
    private readonly orderRepository: Repository<Order>,
    private readonly paymentsService: PaymentsService,
    private readonly dataSource: DataSource,
  ) {}

  async findAll(page = 1, size = 20): Promise<{ items: Order[]; total: number }> {
    const [items, total] = await this.orderRepository.findAndCount({
      relations: ['items'],
      order: { createdAt: 'DESC' },
      skip: (page - 1) * size,
      take: size,
    });
    return { items, total };
  }

  async findOne(id: number): Promise<Order> {
    const order = await this.orderRepository.findOne({
      where: { id },
      relations: ['items'],
    });
    if (!order) {
      throw new NotFoundException(`Order #${id} not found`);
    }
    return order;
  }

  /**
   * 주문 생성 (트랜잭션)
   * - 아이템 수 검증 후 합계 금액 계산
   */
  async create(dto: CreateOrderDto): Promise<Order> {
    if (dto.items.length === 0 || dto.items.length > MAX_ITEMS_PER_ORDER) {
      throw new BadRequestException('Invalid number of items');
    }

    return this.dataSource.transaction(async (manager) => {
      const order = manager.create(Order, {
        customerId: dto.customerId,
        status: OrderStatus.PENDING,
        memo: dto.memo ?? null,
      });

      order.items = dto.items.map((item) =>
        manager.create(OrderItem, {
          productId: item.productId,
          quantity: item.quantity,
          unitPrice: item.unitPrice,
        }),
      );
      order.totalAmount = this.calculateTotal(order.items);

      const saved = await manager.save(order);
      this.logger.log(`Order created: #${saved.id} (${toKstDate(saved.createdAt)})`);
      return saved;
    });
  }

  async cancel(id: number, reason?: string): Promise<Order> {
    const order = await this.findOne(id);

    if (order.status === OrderStatus.SHIPPED) {
      throw new BadRequestException('Shipped orders cannot be cancelled');
    }
    // TODO: 부분 취소 정책 확정되면 수정 (기획 확인 필요)
    if (order.status === OrderStatus.PAID) {
      await this.paymentsService.refund(order.paymentId, order.totalAmount);
    }

    order.status = OrderStatus.CANCELLED;
    order.cancelReason = reason ?? 'USER_REQUEST';
    return this.orderRepository.save(order);
  }

  async bulkUpdateStatus(ids: number[], status: OrderStatus): Promise<number> {
    if (ids.length === 0) return 0;
    const result = await this.orderRepository.update({ id: In(ids) }, { status });
    return result.affected ?? 0;
  }

  private calculateTotal(items: OrderItem[]): number {
    return items.reduce((sum, item) => sum + item.unitPrice * item.quantity, 0);
  }
}
</script>

<script type="text/plain" data-file="src/orders/orders.controller.ts">
import { Body, Controller, Get, Param, ParseIntPipe, Patch, Post, Query, UseGuards } from '@nestjs/common';
import { ApiBearerAuth, ApiOperation, ApiTags } from '@nestjs/swagger';
import { JwtAuthGuard } from '../auth/jwt-auth.guard';
import { OrdersService } from './orders.service';
import { CreateOrderDto } from './dto/create-order.dto';
import { CancelOrderDto } from './dto/cancel-order.dto';

@ApiTags('orders')
@ApiBearerAuth()
@UseGuards(JwtAuthGuard)
@Controller('orders')
export class OrdersController {
  constructor(private readonly ordersService: OrdersService) {}

  @Get()
  @ApiOperation({ summary: '주문 목록 조회' })
  findAll(@Query('page') page = 1, @Query('size') size = 20) {
    return this.ordersService.findAll(Number(page), Number(size));
  }

  @Get(':id')
  @ApiOperation({ summary: '주문 상세 조회' })
  findOne(@Param('id', ParseIntPipe) id: number) {
    return this.ordersService.findOne(id);
  }

  @Post()
  @ApiOperation({ summary: '주문 생성' })
  create(@Body() dto: CreateOrderDto) {
    return this.ordersService.create(dto);
  }

  @Patch(':id/cancel')
  @ApiOperation({ summary: '주문 취소' })
  cancel(@Param('id', ParseIntPipe) id: number, @Body() dto: CancelOrderDto) {
    return this.ordersService.cancel(id, dto.reason);
  }
}
</script>

<script type="text/plain" data-file="src/orders/dto/create-order.dto.ts">
import { Type } from 'class-transformer';
import {
  ArrayMaxSize,
  ArrayMinSize,
  IsInt,
  IsOptional,
  IsPositive,
  IsString,
  MaxLength,
  ValidateNested,
} from 'class-validator';

export class OrderItemDto {
  @IsInt()
  @IsPositive()
  productId: number;

  @IsInt()
  @IsPositive()
  quantity: number;

  @IsInt()
  @IsPositive()
  unitPrice: number;
}

export class CreateOrderDto {
  @IsInt()
  customerId: number;

  @ValidateNested({ each: true })
  @Type(() => OrderItemDto)
  @ArrayMinSize(1)
  @ArrayMaxSize(50)
  items: OrderItemDto[];

  @IsOptional()
  @IsString()
  @MaxLength(200)
  memo?: string;
}
</script>

<script type="text/plain" data-file="src/orders/entities/order.entity.ts">
import {
  Column,
  CreateDateColumn,
  Entity,
  OneToMany,
  PrimaryGeneratedColumn,
  UpdateDateColumn,
} from 'typeorm';
import { OrderItem } from './order-item.entity';

export enum OrderStatus {
  PENDING = 'PENDING',
  PAID = 'PAID',
  SHIPPED = 'SHIPPED',
  CANCELLED = 'CANCELLED',
}

@Entity({ name: 'orders' })
export class Order {
  @PrimaryGeneratedColumn()
  id: number;

  @Column({ name: 'customer_id' })
  customerId: number;

  @Column({ type: 'enum', enum: OrderStatus, default: OrderStatus.PENDING })
  status: OrderStatus;

  @Column({ name: 'total_amount', type: 'int', default: 0 })
  totalAmount: number;

  @Column({ name: 'payment_id', type: 'varchar', nullable: true })
  paymentId: string | null;

  @Column({ type: 'varchar', length: 200, nullable: true })
  memo: string | null;

  @Column({ name: 'cancel_reason', type: 'varchar', nullable: true })
  cancelReason: string | null;

  @OneToMany(() => OrderItem, (item) => item.order, { cascade: true })
  items: OrderItem[];

  @CreateDateColumn({ name: 'created_at' })
  createdAt: Date;

  @UpdateDateColumn({ name: 'updated_at' })
  updatedAt: Date;
}
</script>

<script type="text/plain" data-file="src/orders/entities/order-item.entity.ts">
import { Column, Entity, JoinColumn, ManyToOne, PrimaryGeneratedColumn } from 'typeorm';
import { Order } from './order.entity';

@Entity({ name: 'order_items' })
export class OrderItem {
  @PrimaryGeneratedColumn()
  id: number;

  @ManyToOne(() => Order, (order) => order.items, { onDelete: 'CASCADE' })
  @JoinColumn({ name: 'order_id' })
  order: Order;

  @Column({ name: 'product_id' })
  productId: number;

  @Column({ type: 'int' })
  quantity: number;

  @Column({ name: 'unit_price', type: 'int' })
  unitPrice: number;
}
</script>

<script type="text/plain" data-file="src/payments/payments.service.ts">
import { Injectable, InternalServerErrorException, Logger } from '@nestjs/common';
import { HttpService } from '@nestjs/axios';
import { ConfigService } from '@nestjs/config';
import { firstValueFrom } from 'rxjs';

@Injectable()
export class PaymentsService {
  private readonly logger = new Logger(PaymentsService.name);

  constructor(
    private readonly http: HttpService,
    private readonly config: ConfigService,
  ) {}

  async refund(paymentId: string | null, amount: number): Promise<void> {
    if (!paymentId) return;

    const baseUrl = this.config.getOrThrow<string>('PG_BASE_URL');
    try {
      await firstValueFrom(
        this.http.post(`${baseUrl}/v1/payments/${paymentId}/cancel`, {
          cancelAmount: amount,
          cancelReason: '고객 요청 취소',
        }),
      );
      this.logger.log(`Refunded ${amount} KRW (paymentId=${paymentId})`);
    } catch (e) {
      this.logger.error(`Refund failed: ${paymentId}`, e instanceof Error ? e.stack : String(e));
      throw new InternalServerErrorException('결제 취소 중 오류가 발생했습니다');
    }
  }
}
</script>

<script type="text/plain" data-file="src/common/utils/date.util.ts">
const KST_OFFSET_MS = 9 * 60 * 60 * 1000;

/**
 * UTC Date → KST 기준 'YYYY-MM-DD HH:mm:ss' 문자열
 */
export function toKstDate(date: Date = new Date()): string {
  const kst = new Date(date.getTime() + KST_OFFSET_MS);
  const pad = (n: number) => String(n).padStart(2, '0');

  return (
    `${kst.getUTCFullYear()}-${pad(kst.getUTCMonth() + 1)}-${pad(kst.getUTCDate())} ` +
    `${pad(kst.getUTCHours())}:${pad(kst.getUTCMinutes())}:${pad(kst.getUTCSeconds())}`
  );
}

/** KST 기준 자정 (UTC Date 로 반환) */
export function startOfKstDay(date: Date = new Date()): Date {
  const kst = new Date(date.getTime() + KST_OFFSET_MS);
  kst.setUTCHours(0, 0, 0, 0);
  return new Date(kst.getTime() - KST_OFFSET_MS);
}

export function isBusinessDay(date: Date): boolean {
  const day = new Date(date.getTime() + KST_OFFSET_MS).getUTCDay();
  return day !== 0 && day !== 6;
}
</script>

<script type="text/plain" data-file="src/main.ts">
import { NestFactory } from '@nestjs/core';
import { Logger, ValidationPipe } from '@nestjs/common';
import { DocumentBuilder, SwaggerModule } from '@nestjs/swagger';
import { AppModule } from './app.module';

async function bootstrap() {
  const app = await NestFactory.create(AppModule);
  const port = Number(process.env.PORT ?? 3000);

  app.setGlobalPrefix('api/v1');
  app.enableCors({ origin: process.env.CORS_ORIGIN?.split(',') ?? '*' });
  app.useGlobalPipes(
    new ValidationPipe({
      whitelist: true,
      forbidNonWhitelisted: true,
      transform: true,
    }),
  );

  const config = new DocumentBuilder()
    .setTitle('Order API')
    .setDescription('주문/결제 백오피스 API')
    .setVersion('1.4.2')
    .addBearerAuth()
    .build();
  SwaggerModule.setup('docs', app, SwaggerModule.createDocument(app, config));

  await app.listen(port);
  Logger.log(`Server running on http://localhost:${port}/api/v1`, 'Bootstrap');
}

bootstrap();
</script>
